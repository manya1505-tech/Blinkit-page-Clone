<!DOCTYPE html>
<html>
<head>
    <title>Blinkit Home Page</title>
    <link rel="stylesheet" href="blinkit.css">
    <style> 
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: white;
    color: #333;
}



header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 35px;
    border-bottom: 1px solid #ddd;
}

header h2 {
    color: #f5c842;
    font-size: 35px;
}

header span {
    color: #0c831f;
}

header p {
    font-size: 13px;
    color: gray;
    margin-top: 5px;
}

header input {
    width: 400px;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 7px;
    background-color: #f5f5f5;
}

header a {
    text-decoration: none;
    color: black;
    font-size: 16px;
}

header button {
    background-color: #0c831f;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 7px;
}
.image{
    margin-left: 16px;
}


.imgg {
    margin-left: 5px;
    height: 90vh;
    width:1450px;

}



body > h2 {
    margin: 25px 35px;
    font-size: 23px;
}

.offers {
    display: flex;
    gap: 20px;
    margin: 20px 35px;
    
}

.offer_img1 {
   
    height: 260px;
    width: 380px; 
}

.offer_img2 {
    height: 260px;
    width: 380px; 
    
}

.offer_img3 {
    height: 260px;
    width: 380px; 
}

.offer button {
    background-color: #0c831f;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
}

.offer h1 {
    font-size: 35px;
    margin-top: 15px;
}



.categories {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 15px;
    margin: 30px 35px; 
}

.category {
    
    text-align: center;
    padding: 8px;
    border-radius: 10px;
    border: none;
    outline: none;
    box-shadow: none;
}

.category img {
    width: 90px;
    height: 180px;
    object-fit: cover;
   
}
   

button {
    cursor: pointer;
}

button:hover {
    background-color: #08691a;
} 



@media screen and (max-width: 768px) {

    header {
        flex-wrap: wrap;
        gap: 15px;
    }

    header input {
        width: 100%;
    }

    

    .offers {
        flex-direction: column;
    }

    .offer {
        width: 100%;
    }

    .categories {
        grid-template-columns: repeat(2, 1fr);
    }
}
.image a {
    display: block;
    cursor: pointer;
}
 .imgg {
    cursor: pointer;
}

.login-link {
    text-decoration: none;
    color: black;
    cursor: pointer;
}
    
.login-link:hover {
    color: #0c831f;
}
    
.offer a {
    display: block;
    cursor: pointer;
}
    
.offer img {
    cursor: pointer;
    transition: transform 0.2s ease;
}
    
.category a {
    display: block;
    cursor: pointer;
}
.category img {
    cursor: pointer;
    transition: transform 0.3s ease;
    border: none;
    outline: none;
    box-shadow: none;
}

.category a:hover img {
    transform: scale(1.04);
}

.category a:focus,
.category a:focus-visible,
.category a:active {
    outline: none;
    border: none;
    box-shadow: none;
}    
button, a {
    cursor: pointer;
}

.image {
    overflow: hidden;
    border-radius: 12px;
}

.image a {
    display: block;
    overflow: hidden;
}

.imgg {
    transition: transform 0.3s ease;
}

.image a:hover .imgg {
    transform: scale(1.02);
}


.offer {
    overflow: hidden;
    border-radius: 14px;
}

.offer a {
    display: block;
    overflow: hidden;
}

.offer img {
    transition: transform 0.3s ease;
}

.offer a:hover img {
    transform: scale(1.04);
}

.image a:focus,
.image a:focus-visible,
.offer a:focus,
.offer a:focus-visible {
    outline: none;
    border: none;
    box-shadow: none;
}

.location {
    cursor: pointer;
}

.delivery-time {
    display: flex;
    align-items: center;
    gap: 8px;
}

.delivery-time b {
    font-size: 16px;
    font-weight: bold;
    color: #111;
}

.location-arrow {
    font-size: 12px;
    color: #333;
    cursor: pointer;
}

    </style>
